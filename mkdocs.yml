site_name: Griptape Nodes 繁體中文技術文檔
site_url: https://docs.griptapenodes.com/zh-TW/
copyright: "&copy; Griptape, Inc."

theme:
  name: material
  language: zh-Hant
  logo: assets/img/griptape_nodes_header_logo.svg
  palette:
    # 深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: 切換至淺色模式
    # 淺色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: 切換至深色模式
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - navigation.sections

markdown_extensions:
  - pymdownx.highlight
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - md_in_html
  - attr_list
  - toc:
      toc_depth: 3

extra_css:
  - assets/css/extra.css

